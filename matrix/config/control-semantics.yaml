# Semantic control registry — anti "right-ID-wrong-text" gate (provenance theme F3, H2).
#
# control-id-registry.yaml freezes WHICH control IDs are allowed (membership). This file
# freezes WHAT each control is ABOUT: a distinctive `expect_substring` per control that the
# F3 gate (check_control_semantics in validate_data.py) requires to appear, normalised, in
# the regulatory-trace row's control_short_title + evidence_quote. A row with the right ID
# but another control's text (the audit's HIGH-2: CPS234-§22 carrying §21's text) therefore
# FAILS the build — the right-ID-wrong-text class becomes mechanically impossible.
#
# Seeding: substrings were transcribed from the ALREADY-VERIFIED regulatory-trace titles +
# quotes (the WS1/WS2 + 2026-06-11 strata: 47 ISM, 25 CPS 234, E8, MITRE, and the rest),
# then machine-checked for two properties: (1) SELF-MATCH — every current row containing the
# control already contains its substring; (2) DISTINCTIVENESS — the substring does NOT appear
# in any sibling control's text within the same framework, so a cross-control swap is caught.
# Both properties hold for all 172 controls (0 failures). A few entries are intentionally
# verbose where that is what makes them distinctive; a handful (e.g. the unverified ISO A.5.x
# rows) are minimal — refine opportunistically, but never weaken below distinctiveness.
# NOTE: normalisation is lower-case + collapsed-whitespace; keep the em-dash (—) as written.

