# Data provenance & freshness manifest (provenance theme F1/F2/F4).
#
# Source-level as-of dating + source tiering + refresh ownership. Every framework in
# regulatory-trace.csv AND the vendor-capabilities data MUST have an entry here with a
# non-empty `as_of` and a valid `source_tier`, or validate_data.py FAILS the build.
#
# This is deliberately SOURCE-level, not per-row: per-row capture dates across 1,597
# vendor rows are a data-entry task for the engagement team, not something to fabricate.
# The gate guarantees the boundary is declared and dated; refine to per-row when captured.
#
# source_tier: PRIMARY  = official / vendor first-party documentation
#              ANALYST  = third-party analyst (Gartner / Forrester / KuppingerCole)
#              CONSENSUS = industry consensus / inferred (lower confidence)
# POINT-IN-TIME — re-verify per `refresh` before any client engagement. Frameworks and
# vendor capabilities both drift; an undated claim is an unsupportable claim.

