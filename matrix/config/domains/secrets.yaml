# Secrets management / NHI domain descriptor (Phase 1 #8 — config, not code).
# Loaded by matrix.domains.load_domain(); must stay exactly equal to the historical
# Python SECRETS descriptor (guarded by tests/test_domain_yaml.py).
slug: "secrets"
label: "Secrets management / NHI"
data_dir: "domains/secrets"         # relative to matrix/ (HERE)

# CSV filenames (relative to data_dir)
