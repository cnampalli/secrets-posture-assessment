# Identity Governance & Administration domain descriptor (Phase 3 — config, not code).
# Loaded by matrix.domains.load_domain(); mirrors the pam.yaml field set exactly.
# Guarded by tests/test_domain_yaml.py + tests/test_domains.py.
#
# The instrument scores PROCESS MATURITY of identity governance (joiner/mover/leaver,
# access certification, SoD, access requests), NOT tool deployment. The vendor view
# for IGA is assessed per governance AREA (not the layered L1/L2 model used by
# secrets/PAM) — but the descriptor still carries vendor_layer / short maps, so all
# four IGA suites share a single "suite" layer (L1). The bespoke per-area vendor-fit
# renderer (iga-vendor-fit.csv) is a separate downstream task.
slug: "iga"
label: "Identity Governance & Administration"
data_dir: "domains/iga"             # relative to matrix/ (HERE)

# CSV filenames (relative to data_dir)
vendor_capabilities: "vendor-capabilities.csv"
use_cases: "use-cases.csv"
identity_catalog: "identity-catalog.csv"
regulatory_trace: "regulatory-trace.csv"
default_current_state: "current-state.csv"

# vendor classification maps (slug -> [layer, tier])
# Single "suite" layer for all four — IGA fit is assessed per governance AREA,
# not per-product NATIVE/ADD-ON.
vendor_layer:
  sailpoint-isc: ["L1", "suite"]
  saviynt-eic: ["L1", "suite"]
  microsoft-entra-idg: ["L1", "suite"]
  okta-oig: ["L1", "suite"]

short:
  sailpoint-isc: "SailPoint"
  saviynt-eic: "Saviynt"
  microsoft-entra-idg: "Microsoft Entra"
  okta-oig: "Okta"

layer_label:
  L1: "L1 · IGA platforms (lifecycle / certification / SoD / access requests) — fit assessed per governance area, not per-product NATIVE/ADD-ON"

substrate_slug: ""

# analysis policy
anchors_tier: "suite"
informative_frameworks: []
legacy_recdata: false

# report labels
report_title: "Identity Governance & Administration — Vendor-Selection Report"
report_heading: "Identity Governance & Administration — Vendor Selection"
object_singular: "identity"
object_plural: "identities"
substrate_note: ""

# per-domain body copy (content blocks)
posture_noun: "identity-governance"
object_picker: "identity"
substrate_exclusion_note: ""
substrate_table_note: ""
kpi_object_label: "workforce identities & entitlements"
layer_groups:
  - ["L1", "IGA platforms"]

card_copy:
  rec_l1_label: "IGA platform"
  rec_l2_complement: "Pair with"
  rec_l2_label: "complementary governance area"
  layer_note: "IGA fit is assessed per governance area (lifecycle / certification / SoD / access requests) rather than as a single product score — no one suite leads every area. "
  posture_legend_suffix: " — assessed baseline (template; run the questionnaire to populate posture)."

value_content:
  outcomes:
    - ["hard", "Rationalise identity / IGA tooling", "The vendor matrix exposes overlapping lifecycle, certification, SoD and access-request tooling running in parallel and gives an area-scoped consolidation path across the four IGA suites.", "Tool count &darr; · avoided licence + procurement effort"]
    - ["hours", "Audit &amp; compliance efficiency", "Pre-built access-review / SoD / certification evidence (3-click framework &rarr; control &rarr; use case &rarr; evidence) answers APRA CPS 234 &amp; SOX access-governance audits and cuts findings.", "Audit hours &darr; · findings &darr; · avoided enforcement"]
    - ["risk", "Lower expected breach loss", "Closing orphan / dormant, excess-entitlement and toxic SoD-combination gaps reduces the probability × impact of account compromise and insider fraud.", "Gaps closed · risk-adjusted expected-loss &darr;"]
    - ["kpi", "Reduce operational toil", "Automated joiner / mover / leaver and self-service access requests remove manual provisioning and shrink the de-provisioning backlog.", "Manual provisioning actions &darr; · leaver backlog &darr;"]
  kpis:
    - ["Leaver de-provisioning SLA", "% of leaver access revoked within the agreed SLA", "Joiner/mover/leaver use cases", "continuous"]
    - ["Access-certification completion", "% of scheduled access certifications completed on time", "Certification use cases", "per cycle"]
    - ["Open SoD violations", "count of unremediated toxic entitlement combinations", "Segregation-of-duties use cases", "monthly"]
    - ["Orphan / dormant accounts", "count of accounts with no owner or no recent activity", "Account-hygiene use cases", "per cycle"]
    - ["Access-request cycle time", "median time from access request to fulfilment", "Access-request use cases", "continuous"]
  roi_events: "one access-related audit finding, one SoD / fraud control failure, or one orphaned-account compromise"
  caveats:
    - "<b>Illustrative scenario, not a client assessment.</b> The posture states below are a worked example to show the report&rsquo;s shape — replace them with a real assessment before acting on any figure."
    - "<b>Maturity bands are a roadmap, not a benchmark.</b> The ML1/2/3 ladder is a designed coverage-based convention for tracking progress over time — it is not an external standard and not a peer comparison."
    - "<b>Vendor-fit reflects presence, not efficacy.</b> A NATIVE / PARTIAL rating means the capability exists at that grade, not that it is well-implemented in your environment — validate against your own requirements."
