# Vendor corporate-ownership map — parent-aware concentration analysis (resilience theme E1.5).
#
# Purpose: collapse sibling brands under one ultimate parent so the
# substitutability / concentration math does not count them as independent
# second-sources (a CPS 230 service-provider-concentration requirement).
#
# Schema per entry:
#   parent      ultimate parent vendor_slug (or a parent-entity slug). REQUIRED.
#   confidence  HIGH | MEDIUM | LOW — verification confidence. REQUIRED for acquisitions.
#   as_of       date the ownership fact became true (YYYY-MM or YYYY-MM-DD). Optional.
#   source      where to verify (domain/newsroom). Optional.
#   note        human context.
#
# Vendors NOT listed here are their own parent (handled by resilience.parent_of).
# POINT-IN-TIME SNAPSHOT — M&A changes. VERIFY against primary sources before client use.

cyberark-conjur:
  parent: cyberark
  confidence: HIGH
  note: CyberArk's own product (Conjur secrets broker).

cyberark-pam:
  parent: cyberark
  confidence: HIGH
  note: CyberArk's own product (Privileged Access Manager).

venafi:
  parent: cyberark
  as_of: 2024-10-01
  confidence: HIGH
  source: cyberark.com (newsroom)
  note: >-
    CyberArk completed its acquisition of Venafi (machine-identity / PKI) in
    Oct 2024 (~US$1.54B). Verify exact release before publishing to a client.

cyberark:
  parent: palo-alto-networks
  as_of: 2026-02-11
  confidence: HIGH
  source: paloaltonetworks.com (press) ; sec.gov (PANW 8-K)
  note: >-
    Palo Alto Networks completed its acquisition of CyberArk on 2026-02-11
    (~US$25B; US$45.00 cash + 2.2005 PANW shares per CyberArk share). The
    ultimate parent of the whole CyberArk cluster (Conjur, PAM, Venafi, Zilla)
    is therefore Palo Alto Networks — a materially different CPS 230
    concentration story for an FI already running PANW firewalls/SASE/SOC.
    Sources: paloaltonetworks.com/company/press/2026/palo-alto-networks-
    completes-acquisition-of-cyberark-to-secure-the-ai-era ; PANW SEC 8-K.

hashicorp-vault-enterprise:
  parent: ibm
  as_of: 2025-02-27
  confidence: HIGH
  source: newsroom.ibm.com
  note: >-
    IBM completed its acquisition of HashiCorp in Feb 2025 (~US$6.4B). No other
    HashiCorp brand in this vendor set, so this does not collapse a sibling here,
    but it matters for cross-portfolio parent concentration. Verify before client use.

strongdm:
  parent: delinea
  as_of: 2026-03-05
  confidence: HIGH
  source: delinea.com (newsroom) ; globenewswire.com
  note: >-
    Delinea completed its acquisition of StrongDM on 2026-03-05 (signed a
    definitive agreement 2026-01-15; "Delinea … has completed its acquisition of
    StrongDM" — GlobeNewswire 2026-03-05). Collapses StrongDM under the Delinea
    parent for CPS 230 concentration math (Delinea Secret Server + StrongDM = one
    ultimate parent, not two independent second-sources).

zilla:
  parent: cyberark
  as_of: 2025-02-13
  confidence: HIGH
  source: cyberark.com (press) ; techcrunch.com
  note: >-
    CyberArk acquired Zilla Security (modern IGA — Zilla Comply access reviews +
    Zilla Provisioning lifecycle) on 2025-02-13 for ~US$165M cash + US$10M earn-out
    (up to ~US$175M); zillasecurity.com 302-redirects to cyberark.com/products/modern-iga.
    Collapses Zilla under CyberArk for cross-domain (secrets/PAM/machine-identity/IGA)
    concentration analysis.
